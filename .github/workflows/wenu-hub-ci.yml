name: Wenu Hub CI

on:
  pull_request:
    paths:
      - "wenu-hub/**"
      - ".github/workflows/wenu-hub-ci.yml"
  push:
    branches:
      - "feat/wenu-hub"
    paths:
      - "wenu-hub/**"
      - ".github/workflows/wenu-hub-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wenu-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
