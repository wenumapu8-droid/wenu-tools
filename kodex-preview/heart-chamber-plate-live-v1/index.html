<script>(()=>{const stage=document.querySelector('[data-stage]'),plate=document.querySelector('[data-plate]'),canvas=document.querySelector('[data-fx]'),bpmEl=document.querySelector('[data-bpm]'),cohEl=document.querySelector('[data-coherence]'),flash=document.querySelector('[data-modeflash]'),ctx=canvas.getContext('2d',{alpha:true}),reduce=matchMedia('(prefers-reduced-motion: reduce)'),off=document.createElement('canvas'),ox=off.getContext('2d',{willReadFrequently:true});let W=512,H=512,dpr=1,raf=0,mode='integrate',modeUntil=0,hot=[],sparks=[];const tune={integrate:[1,1,.95],heal:[.85,1,.88],amplify:[1.35,1.1,1],transmute:[1.05,.78,1.2],remember:[.82,.92,1.18]};function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,r.width<700?1.35:1.8);W=Math.max(1,Math.round(r.width*dpr));H=Math.max(1,Math.round(r.height*dpr));canvas.width=W;canvas.height=H}function sample(){off.width=512;off.height=512;ox.drawImage(plate,0,0,512,512);const im=ox.getImageData(0,0,512,512).data,c=[];for(let y=72;y<446;y+=3)for(let x=96;x<398;x+=3){const i=(y*512+x)*4,r=im[i],g=im[i+1],b=im[i+2],lum=.2126*r+.7152*g+.0722*b;if(lum>112&&r>g*1.05&&r>b*1.18)c.push({x:x/512,y:y/512,p:Math.min(1,(lum-110)/145)})}hot=[];for(let i=0;i<Math.min(145,c.length);i++)hot.push(c[Math.floor((i*9973)%c.length)]);sparks=Array.from({length:70},(_,i)=>({h:hot[i%Math.max(1,hot.length)]||{x:.5,y:.5,p:1},a:(i*1.618)%6.28,s:.35+(i%7)*.055,z:.35+(i%5)*.13}))}function readouts(t){const bpm=72+Math.sin(t*.58)*1.15+Math.sin(t*1.71)*.28,coh=91.2+Math.sin(t*.19)*1.05+Math.sin(t*.73)*.25;bpmEl.innerHTML=`${bpm.toFixed(0)} BPM <small>SIM</small>`;cohEl.innerHTML=`${coh.toFixed(1)}% <small>SIM</small>`}function draw(now){const t=now/1000;ctx.clearRect(0,0,W,H);const m=tune[mode]||tune.integrate,beat=(Math.sin(t*Math.PI*2*1.2)+1)/2,hx=.505*W,hy=.515*H;ctx.save();ctx.globalCompositeOperation='lighter';const rr=(.038+.017*Math.pow(beat,5))*W,g=ctx.createRadialGradient(hx,hy,0,hx,hy,rr*3.5);g.addColorStop(0,`rgba(255,218,190,${.16+.21*beat})`);g.addColorStop(.18,`rgba(255,112,78,${.18+.22*beat})`);g.addColorStop(1,'rgba(255,60,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,rr*3.5,0,Math.PI*2);ctx.fill();for(let k=0;k<3;k++){const r=(.19+k*.074+Math.sin(t*.7+k)*.002)*W;ctx.strokeStyle=`rgba(${255*m[0]},${118*m[1]},${82*m[2]},${.025+.02*beat})`;ctx.lineWidth=Math.max(1,dpr*.55);ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke()}hot.forEach((p,i)=>{const tw=.25+.75*((Math.sin(t*(1.2+(i%9)*.07)+i*2.13)+1)/2);if(tw<.62)return;ctx.fillStyle=`rgba(255,${142+Math.floor(50*p.p)},${105+Math.floor(40*p.p)},${.035+.12*tw*p.p})`;ctx.beginPath();ctx.arc(p.x*W,p.y*H,(.4+p.p*1.4)*dpr,0,Math.PI*2);ctx.fill()});sparks.forEach((q,i)=>{q.a+=.006*q.s;const d=reduce.matches?0:Math.sin(t*.5+i)*1.7*dpr,x=q.h.x*W+Math.cos(q.a)*d,y=q.h.y*H+Math.sin(q.a*.8)*d,a=.025+.075*((Math.sin(t*q.z+i)+1)/2);ctx.fillStyle=`rgba(255,132,92,${a})`;ctx.fillRect(x,y,Math.max(1,dpr*.65),Math.max(1,dpr*.65))});ctx.restore();readouts(t);if(now<modeUntil)stage.dataset.modeActive='1';else delete stage.dataset.modeActive;if(!reduce.matches)raf=requestAnimationFrame(draw)}function start(){cancelAnimationFrame(raf);resize();if(reduce.matches)draw(performance.now());else raf=requestAnimationFrame(draw)}function setMode(n){mode=n;flash.textContent=n.toUpperCase();modeUntil=performance.now()+900;stage.dataset.modeActive='1';if(n==='amplify')stage.animate([{filter:'brightness(1)'},{filter:'brightness(1.09)'},{filter:'brightness(1)'}],{duration:760,easing:'ease-out'})}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));stage.addEventListener('pointermove',e=>{if(reduce.matches)return;const r=stage.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;stage.style.setProperty('--px',`${nx*-3}px`);stage.style.setProperty('--py',`${ny*-3}px`)},{passive:true});stage.addEventListener('pointerleave',()=>{stage.style.set
